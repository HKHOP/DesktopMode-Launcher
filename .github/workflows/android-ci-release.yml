name: Android CI + Auto Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Resolve release metadata
        id: meta
        run: |
          TAG="auto-v${GITHUB_RUN_NUMBER}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Locate release APK
        id: apk
        run: |
          APK_PATH="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "No APK file found in app/build/outputs/apk/release"
            exit 1
          fi

          echo "apk_path=${APK_PATH}" >> "$GITHUB_OUTPUT"
          echo "Detected APK: ${APK_PATH}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Desktop Launcher ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.apk_path }}
